<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Muthyala ❤ Mothina</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600&family=Rye&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Ponnala&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="d-flex vh-100 align-items-center justify-content-center" style="background-color: var(--bg-color);">
    <div class="container">
      <div class="row gx-4 gy-4">
        <!-- Groom’s Invite Card -->
        <div class="col-md-6">
          <a href="#" class="invite-card text-decoration-none">
            <div class="card h-100 border-0">
              <div class="card-body">
                <h3 class="card-title">Groom’s Invite</h3>
                <p class="card-text">Hear the groom’s side of our story—where love first sparked.</p>
                <p class="invite-name">Mothina Abbai Chowdary</p>
                <span class="btn btn-outline-light mt-3">Have a Look</span>
              </div>
            </div>
          </a>
        </div>
        <!-- Bride’s Invite Card -->
        <div class="col-md-6">
          <a href="#" class="invite-card text-decoration-none">
            <div class="card h-100 border-0">
              <div class="card-body">
                <h3 class="card-title">Bride’s Invite</h3>
                <p class="card-text">Discover the bride’s journey—where two hearts became one.</p>
                <p class="invite-name">Muthyala Anusha</p>
                <span class="btn btn-outline-light mt-3">Have a Look</span>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional for future interactivity) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"
  ></script>
</body>
</html>
